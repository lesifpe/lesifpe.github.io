name: Java CI with Maven and Docker

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar e Gerar o pacote (JAR) com o Maven
      run: mvn clean package -DskipTests

    # --- NOVOS PASSOS DO DESAFIO DOCKER ---
    - name: Construir a Imagem Docker
      run: docker build -t sistema-editais:latest .

    - name: Executar o Container para teste
      # Roda o container em background e depois exibe os logs para ver se subiu
      run: |
        docker run -d --name editais-ci sistema-editais:latest
        sleep 5
        docker logs editais-ci
