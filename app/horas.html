<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Horas · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/horas.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Gestão de Horas</h1>
                    <p class="app-page-sub">Lançamento e acompanhamento de horas por projeto</p>
                </div>
                <div class="app-page-actions">
                    <button class="btn-solid" id="btn-nova-hora">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Lançar horas
                    </button>
                </div>
            </div>

            <div class="horas-kpis">
                <div class="kpi-card">
                    <div class="kpi-label">Total geral</div>
                    <div class="kpi-value" id="horas-total">—</div>
                    <div class="kpi-meta">Todas as horas registradas</div>
                </div>
                <div class="kpi-card" data-variant="blue">
                    <div class="kpi-label">Este mês</div>
                    <div class="kpi-value" id="horas-mes">—</div>
                    <div class="kpi-meta">No mês corrente</div>
                </div>
                <div class="kpi-card" data-variant="gold">
                    <div class="kpi-label">Esta semana</div>
                    <div class="kpi-value" id="horas-semana">—</div>
                    <div class="kpi-meta">Últimos 7 dias</div>
                </div>
            </div>

            <div class="grid-2">
                <div class="app-card">
                    <div class="app-card-head">
                        <h3 class="app-card-title">Lançamentos</h3>
                    </div>
                    <div class="horas-filters">
                        <select id="filtro-projeto">
                            <option value="">Todos os projetos</option>
                        </select>
                        <input type="month" id="filtro-mes">
                    </div>
                    <div id="horas-lista">
                        <div class="spinner"></div>
                    </div>
                </div>

                <div class="app-card">
                    <div class="app-card-head">
                        <h3 class="app-card-title">Horas por projeto</h3>
                    </div>
                    <div class="horas-por-projeto" id="horas-por-projeto">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/horas.js"></script>

</body>
</html>
