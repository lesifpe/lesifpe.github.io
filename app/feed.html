<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Feed · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/feed.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Feed</h1>
                    <p class="app-page-sub">Comunicação interna da liga</p>
                </div>
            </div>

            <div class="feed-layout">

                <div>
                    <!-- Composer -->
                    <div class="feed-composer">
                        <div class="feed-composer-top">
                            <div class="avatar" id="composer-avatar"></div>
                            <div class="feed-composer-input">
                                <textarea id="composer-text" placeholder="Compartilhe algo com a liga..."></textarea>
                            </div>
                        </div>
                        <div class="feed-composer-actions">
                            <div class="feed-composer-tools">
                                <span style="font-size:0.78rem;color:var(--gray-lt);align-self:center">
                                    Publicações visíveis para toda a liga
                                </span>
                            </div>
                            <button class="btn-solid" id="btn-publicar">Publicar</button>
                        </div>
                    </div>

                    <!-- Lista de posts -->
                    <div id="feed-posts">
                        <div class="spinner"></div>
                    </div>

                    <!-- Carregar mais -->
                    <div id="feed-mais" class="app-page-actions" style="justify-content:center;margin-top:1rem"></div>
                </div>

                <aside class="feed-sidebar">
                    <div class="feed-sidebar-card">
                        <div class="feed-sidebar-title">Aniversariantes do mês</div>
                        <div id="feed-aniversariantes">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <div class="feed-sidebar-card">
                        <div class="feed-sidebar-title">Atalhos</div>
                        <a href="eventos.html" class="app-nav-item" style="margin-bottom:0.35rem">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            Ver eventos
                        </a>
                        <a href="documentos.html" class="app-nav-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6"/>
                            </svg>
                            Documentos
                        </a>
                    </div>
                </aside>

            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/feed.js"></script>

</body>
</html>
