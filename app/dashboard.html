<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Dashboard · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Dashboard</h1>
                    <p class="app-page-sub">Visão geral da liga</p>
                </div>
                <div class="app-page-actions">
                    <button class="btn-ghost" id="btn-refresh">Atualizar</button>
                </div>
            </div>

            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Membros ativos</div>
                    <div class="kpi-value" id="kpi-membros"><span class="spinner"></span></div>
                    <div class="kpi-meta">Total na liga</div>
                </div>

                <div class="kpi-card" data-variant="blue">
                    <div class="kpi-label">Projetos ativos</div>
                    <div class="kpi-value" id="kpi-projetos"><span class="spinner"></span></div>
                    <div class="kpi-meta">Em andamento</div>
                </div>

                <div class="kpi-card" data-variant="gold">
                    <div class="kpi-label">Eventos no mês</div>
                    <div class="kpi-value" id="kpi-eventos"><span class="spinner"></span></div>
                    <div class="kpi-meta">Workshops, cursos e palestras</div>
                </div>

                <div class="kpi-card" data-variant="red">
                    <div class="kpi-label">Horas registradas</div>
                    <div class="kpi-value" id="kpi-horas"><span class="spinner"></span></div>
                    <div class="kpi-meta">Este mês</div>
                </div>
            </div>

            <div class="grid-2">
                <div class="app-card">
                    <div class="app-card-head">
                        <h2 class="app-card-title">Próximos eventos</h2>
                        <a href="eventos.html" class="btn-ghost" style="padding:.4rem .9rem;font-size:.7rem">
                            Ver todos
                        </a>
                    </div>
                    <div id="dash-eventos"><div class="spinner"></div></div>
                </div>

                <div class="app-card">
                    <div class="app-card-head">
                        <h2 class="app-card-title">Atividade recente</h2>
                    </div>
                    <div id="dash-atividade"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="app-card" style="margin-top:1.25rem">
                <div class="app-card-head">
                    <h2 class="app-card-title">Últimas do feed</h2>
                    <a href="feed.html" class="btn-ghost" style="padding:.4rem .9rem;font-size:.7rem">
                        Abrir feed
                    </a>
                </div>
                <div id="dash-feed"><div class="spinner"></div></div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/dashboard.js"></script>

</body>
</html>
