<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Patrimônio · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/patrimonio.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Patrimônio</h1>
                    <p class="app-page-sub">Equipamentos e materiais da liga</p>
                </div>
                <div class="app-page-actions" data-perm="PATRIMONIO_GERENCIAR">
                    <button class="btn-solid" id="btn-novo-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Novo item
                    </button>
                </div>
            </div>

            <div class="patrimonio-kpis">
                <div class="kpi-card">
                    <div class="kpi-label">Total de itens</div>
                    <div class="kpi-value" id="pat-total">—</div>
                    <div class="kpi-meta">Inventário total</div>
                </div>
                <div class="kpi-card" data-variant="blue">
                    <div class="kpi-label">Em uso</div>
                    <div class="kpi-value" id="pat-em-uso">—</div>
                    <div class="kpi-meta">Com membros</div>
                </div>
                <div class="kpi-card" data-variant="gold">
                    <div class="kpi-label">Valor total</div>
                    <div class="kpi-value" id="pat-valor">—</div>
                    <div class="kpi-meta">Estimado</div>
                </div>
            </div>

            <div class="patrimonio-filters">
                <input type="text" id="filtro-busca" placeholder="Buscar por nome...">
                <select id="filtro-categoria">
                    <option value="">Todas as categorias</option>
                    <option value="ELETRONICO">Eletrônico</option>
                    <option value="MOBILIARIO">Mobiliário</option>
                    <option value="LIVRO">Livro / Apostila</option>
                    <option value="FERRAMENTA">Ferramenta</option>
                    <option value="OUTRO">Outro</option>
                </select>
                <select id="filtro-estado">
                    <option value="">Todos os estados</option>
                    <option value="DISPONIVEL">Disponível</option>
                    <option value="EM_USO">Em uso</option>
                    <option value="MANUTENCAO">Em manutenção</option>
                    <option value="DESCARTADO">Descartado</option>
                </select>
            </div>

            <div id="patrimonio-container">
                <div class="spinner"></div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/patrimonio.js"></script>

</body>
</html>
