<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Financeiro · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/financeiro.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Financeiro</h1>
                    <p class="app-page-sub">Controle de receitas e despesas da liga</p>
                </div>
                <div class="app-page-actions" data-perm="FINANCEIRO_LANCAR">
                    <button class="btn-solid" id="btn-novo-lancamento">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Novo lançamento
                    </button>
                </div>
            </div>

            <div class="financeiro-kpis">
                <div class="kpi-card">
                    <div class="kpi-label">Saldo atual</div>
                    <div class="kpi-value" id="fin-saldo">—</div>
                    <div class="kpi-meta">Receitas − despesas</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Receitas no mês</div>
                    <div class="kpi-value" id="fin-receitas">—</div>
                    <div class="kpi-meta">Entradas</div>
                </div>
                <div class="kpi-card" data-variant="red">
                    <div class="kpi-label">Despesas no mês</div>
                    <div class="kpi-value" id="fin-despesas">—</div>
                    <div class="kpi-meta">Saídas</div>
                </div>
            </div>

            <div class="grid-2">
                <div class="app-card">
                    <div class="app-card-head">
                        <h3 class="app-card-title">Lançamentos</h3>
                    </div>
                    <div class="financeiro-filters">
                        <select id="filtro-tipo">
                            <option value="">Todos</option>
                            <option value="RECEITA">Receitas</option>
                            <option value="DESPESA">Despesas</option>
                        </select>
                        <input type="month" id="filtro-mes">
                    </div>
                    <div id="fin-lista">
                        <div class="spinner"></div>
                    </div>
                </div>

                <div class="app-card">
                    <div class="app-card-head">
                        <h3 class="app-card-title">Por categoria</h3>
                    </div>
                    <div class="fin-categorias" id="fin-categorias">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/financeiro.js"></script>

</body>
</html>
