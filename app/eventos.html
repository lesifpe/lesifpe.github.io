<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Eventos · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/eventos.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Eventos</h1>
                    <p class="app-page-sub">Workshops, cursos e palestras da liga</p>
                </div>
                <div class="app-page-actions" data-perm="EVENTO_CRIAR">
                    <button class="btn-solid" id="btn-novo-evento">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Novo evento
                    </button>
                </div>
            </div>

            <div class="eventos-filters">
                <input type="text" id="filtro-busca" placeholder="Buscar por título...">
                <select id="filtro-tipo">
                    <option value="">Todos os tipos</option>
                    <option value="WORKSHOP">Workshop</option>
                    <option value="CURSO">Curso</option>
                    <option value="BOOTCAMP">Bootcamp</option>
                    <option value="PALESTRA">Palestra</option>
                </select>
                <select id="filtro-status">
                    <option value="">Todos os status</option>
                    <option value="AGENDADO">Agendado</option>
                    <option value="FINALIZADO">Finalizado</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>

            <div id="eventos-container">
                <div class="spinner"></div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/eventos.js"></script>

</body>
</html>
