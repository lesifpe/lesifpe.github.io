<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Documentos · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/documentos.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Documentação</h1>
                    <p class="app-page-sub">Atas de reunião, decisões e roadmap da liga</p>
                </div>
                <div class="app-page-actions" data-perm="DOCUMENTO_PUBLICAR">
                    <button class="btn-solid" id="btn-novo-doc">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Publicar documento
                    </button>
                </div>
            </div>

            <div class="docs-filters">
                <input type="text" id="filtro-busca" placeholder="Buscar por título...">
                <select id="filtro-tipo">
                    <option value="">Todos os tipos</option>
                    <option value="ATA">Ata de reunião</option>
                    <option value="DECISAO">Decisão</option>
                    <option value="ROADMAP">Roadmap</option>
                    <option value="POLITICA">Política</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>

            <div id="docs-container">
                <div class="spinner"></div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/documentos.js"></script>

</body>
</html>
