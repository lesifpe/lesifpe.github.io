<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Presença · LES-IFPE</title>
    <link rel="icon" href="../assets/imagens/logos/leslogowithouttext.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/presenca.css">
</head>

<body>

    <div class="app-shell">

        <aside class="app-sidebar" data-sidebar></aside>
        <header class="app-topbar" data-topbar></header>

        <main class="app-content">

            <div class="app-page-head">
                <div>
                    <h1 class="app-page-title">Presença</h1>
                    <p class="app-page-sub">Registre a presença dos membros em eventos</p>
                </div>
                <div class="app-page-actions">
                    <select id="seletor-evento" class="membros-select" style="min-width:280px">
                        <option value="">Selecione um evento</option>
                    </select>
                </div>
            </div>

            <div id="presenca-content">
                <div class="empty-state">
                    <div class="empty-state-title">Selecione um evento</div>
                    <p class="empty-state-sub">Escolha um evento no seletor acima para registrar presença.</p>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script type="module" src="../js/views/presenca.js"></script>

</body>
</html>
